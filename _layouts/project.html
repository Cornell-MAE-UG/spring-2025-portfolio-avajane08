---
layout: default
---

<h1>{{ page.title }}</h1>

{% if page.show_hero %}
<p><img src="{{ page.image | relative_url }}" alt="{{ page.imagealt }}" class="project-image" /></p>
{% endif %}

{{ content }}

<div style="clear: both;"></div>

<p><strong>Technologies Used</strong>: {{ page.technologies | join: ", " }}</p>

{% if page.category == 'beyond' %}
<a href="{{ "/beyond-engineering/" | relative_url }}" class="back-arrow">
    <i class="bi bi-arrow-left-circle-fill"></i> Back to Beyond Engineering
</a>
{% else %}
<a href="{{ "/projects/" | relative_url }}" class="back-arrow">
    <i class="bi bi-arrow-left-circle-fill"></i> Back to Projects
</a>
{% endif %}
